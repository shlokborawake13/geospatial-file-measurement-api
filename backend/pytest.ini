[pytest]
# Run tests from the backend/ directory:
#   cd backend && pytest tests/ -v
#
# Or from the project root:
#   cd backend && python -m pytest tests/ -v
#
# The system Python on this machine has a broken langsmith pytest plugin
# that crashes before pytest starts. Use a virtual environment to avoid it:
#   python -m venv .venv
#   .venv\Scripts\activate
#   pip install -r requirements.txt
#   pytest tests/ -v
testpaths = tests
pythonpath = .
